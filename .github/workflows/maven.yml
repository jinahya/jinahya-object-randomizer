# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:

    runs-on: ubuntu-latest

    # one run per Jakarta EE generation; each profile pins its own platform BOM,
    # Hibernate Validator and Expressly, and compiles its own src/test/java-jakarta-ee-NN
    strategy:
      fail-fast: false
      matrix:
        profile: [ jakarta-ee-11, jakarta-ee-10 ]

    name: build (${{ matrix.profile }})

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml -P ${{ matrix.profile }}

  # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
  # Submitted once, from the default generation, so the two profiles do not overwrite each other's snapshot
  dependency-graph:

    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    # the snapshot upload is a write against the repository, which the default
    # token is not granted; scoped to this job so the build matrix keeps its
    # read-only one
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c # v6.0.1
